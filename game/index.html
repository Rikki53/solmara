<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solmara — Sun, Streets &amp; Second Chances</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #12151c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    touch-action: none;
  }
  #hud-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="game" aria-label="Solmara: 3D open-world coastal crime game. Explore on foot and by car."></canvas>
<div id="hud-overlay"></div>
<p id="status" role="status" aria-live="polite">Solmara loaded. Use WASD to move or drive, Shift to sprint, Space to jump or drift, E to enter or exit vehicles, and Mouse to orbit camera.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
